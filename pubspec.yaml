name: flower_identification_app
description: A flower identification app with medicinal properties, skincare benefits, and cultivation guidance
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  camera: ^0.10.5
  image_picker: ^1.0.4
  tflite_flutter: ^0.12.0
  image: ^4.0.17
  google_fonts: ^6.1.0
  provider: ^6.0.5
  path_provider: ^2.1.0
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/flower_model_26classes.tflite
    - assets/flower_data_26.json
    - assets/images/
    - assets/icons/